{% extends "app/layout.html" %}

{% block content %}

<h1>Лабораторные работы по физике школа 192</h1>
<br>
<br>
<br>

<div class="cards-grid">
    {% for course in courses %}
    <a href="{% url 'labs' course.grade %}" class="card" data-class="{{ course.grade }}">
        <div class="card-number">{{ course.grade }}</div>
        <div class="card-content">
            <div class="card-title">{{ course.title }}</div>
        </div>
        <svg class="card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
    {% endfor %}
</div>



{% endblock %}

{% block scripts %}
{% endblock %}
